name: booktune
description: Lecteur de livres audio avec musique d'ambiance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # Notifications médias
  just_audio_background: ^0.0.1-beta.11
  
  # File picker (corrigé)
  file_picker: ^8.1.2
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Base de données
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # State management
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Utilitaires
  uuid: ^4.2.2

  # API
  http: ^1.2.1

  # Logging
  logger: ^2.0.2+1



dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.11.0
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/ambient/

