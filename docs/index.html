<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookTune - Lecteur Audio Révolutionnaire</title>
    <meta http-equiv="refresh" content="0; url=booktune_presentation.html">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .loading {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="loading">
        <h1>🎧 BookTune</h1>
        <p>Redirection vers la page de présentation...</p>
        <p><a href="booktune_presentation.html" style="color: #3b82f6;">Cliquez ici si la redirection ne fonctionne pas</a></p>
    </div>

    <script>
        // Redirection automatique après 2 secondes si la meta refresh ne fonctionne pas
        setTimeout(function() {
            window.location.href = 'booktune_presentation.html';
        }, 2000);
    </script>
</body>
</html>
